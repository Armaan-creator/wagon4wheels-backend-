spring.application.name=wagon4wheels-backend
server.port=8080

# Local MongoDB by default - override MONGODB_URI for Atlas/production
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/wagon4wheels}

# DEV-ONLY DEFAULT - override JWT_SECRET before deploying anywhere real
app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-before-deploying-1234567890}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:43200000}

app.cors.allowed-origin=${FRONTEND_ORIGIN:http://localhost:3000}

app.upload.dir=${UPLOAD_DIR:uploads}

# Seeded on first run if no admin user exists yet - matches the frontend's
# current demo login (admin/admin123). Override before deploying.
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:admin123}
